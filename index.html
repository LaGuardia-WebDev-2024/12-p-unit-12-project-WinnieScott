<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Unit 12 Project</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <h1>Quiz About Groundhog Day</h1>
    <hr />
    <!-- Movie Question -->
    <form id="movie-form">
      <label>
        What town does Phil live in?
        <select id="movie-answer">
          <option value="movie1">Scranton, PA</option>
          <option value="movie2">Allentown, PA</option>
          <option value="movie3">Punxatawney, PA</option>
          <option value="movie4">Vorhees, NJ</option>
        </select>
      </label>
      <button type="submit">Check Answer</button>
    </form>
    <div id="movie-result">
      <p id="movie-text"></p>
    </div>
    <hr />
    <!-- Book Question -->
    <form id="book-form">
      <label>
        What object allows the president of the inner circle to speak Groundhogese and communicate with Phil to recieve his prediction?
        <select id="book-answer">
          <option value="book1">An ancient wooden staff</option>
          <option value="book2">A mystical book</option>
          <option value="book3">Nothing, Phil actually speaks English</option>
          <option value="book4">A piece of Quartz</option>
        </select>
      </label>
      <button type="submit">Check Answer</button>
    </form>
    <div id="book-result">
      <p id="book-text"></p>
 </div>
  <!-- Book Question -->
    <form id="q3-form">
      <label>
        How old is Phil?
        <select id="q3-answer">
          <option value="age1">7</option>
          <option value="age2">140</option>
          <option value="age3">3</option>
          <option value="age4">512</option>
        </select>
      </label>
      <button type="submit">Check Answer</button>
    </form>
    <div id="q3-result">
      <p id="q3-text"></p>

  <form id="q4-form">
      <label>
        What holiday did Groundhog Day originate from?
        <select id="q4-answer">
          <option value="holiday1">Saturnalia (Ancient Rome)</option>
          <option value="holiday2">Candlemas (Germany)</option>
          <option value="holiday3"></option>
          <option value="holiday4">512</option>
        </select>
      </label>
      <button type="submit">Check Answer</button>
    </form>
    <div id="q4-result">
      <p id="q4-text"></p>
   
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
    <script>
      
      //========================Movie Question jQuery Code
      $("#movie-form").on("submit", function (event) {
        event.preventDefault();

        var $answer = $("#movie-answer");
        var answer = $answer.val();

        if (answer === "movie3") {
          $("#movie-text").text("YESSSS!");
        } 
        else {
          $("#movie-text").text("Try Again!");
        }
      });

      //=======================Book Question jQuery Code
      $("#book-form").on("submit", function (event) {
        event.preventDefault();

        var $answer = $("#book-answer");
        var answer = $answer.val();

        if (answer === "book1") {
          $("#book-text").text("YESSSS!");
        } 
        else {
          $("#book-text").text("Try Again!");
        }
      });

     //=======================Book Question jQuery Code
      $("#q3-form").on("submit", function (event) {
        event.preventDefault();

        var $answer = $("#q3-answer");
        var answer = $answer.val();

        if (answer === "age2") {
          $("#q3-text").text("YESSSS!");
        } 
        else {
          $("#q3-text").text("Try Again!");
        }
      });
      
    </script>
  </body>

  <!--- Taken From Khan Academy HTML/JS: Making webpages interactive with jQuery-->
</html>
